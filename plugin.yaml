name: hermes-make-it-smart
version: 0.32.2
description: "Hermes, Make it Smart! — Session categorization, tagging, renaming and LAST USED activity filtering (Up to 8h, 8-16h, 16-24h, 24h, 24-48h, Today, Yesterday by last post timestamp) to access all your sessions — faster than it takes to press 3 clicks."
author: "the owner"
license: MIT
homepage: https://github.com/tesla963/hermes-make-it-smart
manifest_version: 2
api_version: 1
provides_hooks:
  - on_session_end
provides_tools:
  - cellar_search
  - cellar_session
  - cellar_stats
  - cellar_series
  - cellar_rename
  - cellar_tag
  - cellar_cheatsheet
  - cellar_index
  - cellar_verify
  - cellar_export
requires_env: []
config_schema:
  api_key:
    type: secret
    env: MMS_API_KEY
    label: "BYO AI API key"
    description: "Clave del motor propio del plugin. Hermes la guarda en el .env del perfil; el plugin solo la lee con get_secret y nunca la escribe en sus archivos."
python_dependencies: ["PyYAML>=6,<7"]
data:
  canonical_dir: "~/.hermes/plugin-data/make-it-smart"
  ui_dir: "~/Library/Application Support/Hermes/plugin-files/data/make-it-smart"
  cheat_sheet_objective: "core/cheat_sheet.yaml"
  cheat_sheet_personal: "cheat_sheet.personal.yaml"
  index: "index.json"
  facets: "facets.json"
  pending: "pending_index.json"
  exports: "exports/"
  backups: "backups/"
