name: hermes-make-all-my-work-smart
version: 0.1.0
description: "Hermes, Make it Smart! — Session categorization, tagging and renaming to access all your sessions — faster than it takes to press 3 clicks."
author: "Jorge Matsufuji"
license: MIT
homepage: https://github.com/tesla963/hermes-make-it-smart
manifest_version: 2
api_version: 1
provides_hooks:
  - on_session_end
provides_tools:
  - cellar_search
  - cellar_session
  - cellar_stats
  - cellar_series
  - cellar_rename
  - cellar_tag
  - cellar_bateria
  - cellar_index
  - cellar_verify
  - cellar_export
requires_env: []
