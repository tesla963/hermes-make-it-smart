name: hermes-make-it-smart
version: 0.27.0
description: "Hermes, Make it Smart! — Session categorization, tagging and renaming to access all your sessions — faster than it takes to press 3 clicks."
author: "Jorge Matsufuji"
license: MIT
homepage: https://github.com/tesla963/hermes-make-it-smart
manifest_version: 2
api_version: 1
provides_hooks:
  - on_session_end
provides_tools:
  - cellar_search
  - cellar_session
  - cellar_stats
  - cellar_series
  - cellar_rename
  - cellar_tag
  - cellar_bateria
  - cellar_index
  - cellar_verify
  - cellar_export
requires_env: []
data:
  canonical_dir: "~/.hermes/plugin-data/make-it-smart"
  ui_dir: "~/Library/Application Support/Hermes/plugin-files/data/make-it-smart"
  bateria_objetiva: "core/bateria.yaml"
  bateria_personal: "bateria.personal.yaml"
  index: "index.json"
  facets: "facets.json"
  pending: "pending_index.json"
  exports: "exports/"
  backups: "backups/"
