# Corrections taught by the owner.
# Every entry is a rule AND the evidence that taught it.
# Rendered into the classifier prompt as few-shot examples and mirrored in tests/eval/.
#
# The rule is what generalizes. The example is what proves it. The control
# question is what to ask when the rule does not obviously apply.

# --------------------------------------------------------------------------- #
# NAMES
# --------------------------------------------------------------------------- #

- id: name-the-agent
  taught: 2026-11-09
  rule: >
    The assistant has a name the owner chose. When the session is about the
    assistant itself — its identity, its availability, whether it responds —
    the subject is that NAME ("Lisa"), never a paraphrase like "Disponibilidad
    del asistente" or "Identidad y modelo". Call things by their name.
  examples:
    - { nnn: 1, subject: "Lisa", tag1: "Hermes Telegram" }
    - { nnn: 12, subject: "Lisa", tag1: "Hermes Desktop", tag2: "Troubleshooting" }
  control_question: "Is the owner talking TO the assistant, or ABOUT something else?"

- id: full-product-names
  taught: 2026-11-08
  rule: >
    Never abbreviate the host's own names: Hermes Agent, Hermes Desktop,
    Hermes Terminal, Hermes Telegram. Never a bare "Hermes".
  examples:
    - { right: "Hermes Agent", wrong: "Hermes" }

- id: ia-short-form
  taught: 2026-11-08
  rule: >
    Use "IA" in titles, not "Inteligencia Artificial": 22 characters eat the
    description and leave 96 titles with no text. The search bridges all forms.
  bridge: ["IA", "AI", "Inteligencia Artificial", "Artificial Intelligence"]

# --------------------------------------------------------------------------- #
# SUBJECT
# --------------------------------------------------------------------------- #

- id: subject-is-never-the-program
  taught: 2026-11-07
  rule: >
    The subject names the object, problem or symptom. The platform goes in Tag1.
    If they are nearly the same, something is wrong.
  examples:
    - { nnn: 582, wrong_subject: "Hermes", right_subject: "Case USB", tag1: "ORICO" }
  note: 187 sessions corrected on this rule.

- id: subject-never-carries-the-action
  taught: 2026-11-09
  rule: >
    The subject is the actor or the object, never the action done to it.
    "Indexación Spotlight" is wrong; the subject is "Spotlight".
  examples:
    - { nnn: 6, wrong_subject: "Indexación Spotlight", right_subject: "Spotlight", verb: "Indexación" }
    - { nnn: 10, wrong_subject: "Vocabulario Constitución", right_subject: "Constitución", verb: "Vocabulario" }
    - { nnn: 4, wrong_subject: "Cambios de precios", right_subject: "Precios", verb: "Cotizar" }

- id: subject-strips-action-prefix
  taught: 2026-11-08
  rule: Strip the action prefix; the verb belongs at the end of the description.
  examples:
    - { wrong: "Suplemento Vitamina C", right: "Vitamina C" }
    - { wrong: "Dolor Interoseos", right: "Interoseos" }
    - { wrong: "Auto-arranque Gateway Telegram", right: "Gateway Telegram" }

- id: failure-point-naming
  taught: 2026-11-08
  rule: >
    Name the point of failure, not the component. A broken gateway is
    "Protocolo"; a permission dialog is "Ventana Permisos".
  examples:
    - { nnn: 20, subject: "Protocolo", tag1: "Telegram Gateway", tag2: "Troubleshooting" }
    - { nnn: 13, subject: "Ventana Permisos", tag1: "Hermes Agent", tag2: "Data Security" }

# --------------------------------------------------------------------------- #
# THE VERB DECIDES THE SUBJECT
# --------------------------------------------------------------------------- #

- id: verb-first-then-subject
  taught: 2026-11-09
  rule: >
    Decide the verb FIRST, then shape the subject around it. The verb tells you
    what kind of noun the subject must be: a thing (Costo → "Pedido"), the actor
    being tested (Testing → "Lisa"), a failing part (Falta de Espacio →
    "Hard Drive"). A subject chosen before the verb is usually the wrong noun.
  examples:
    - { verb: "Costo", subject: "Pedido" }
    - { verb: "Falta de Espacio", subject: "Hard Drive" }
    - { verb: "Cotizar", subject: "Precios" }
  control_question: "What action was taken — and what noun does that action demand?"

- id: money-verb-is-costo
  taught: 2026-11-09
  rule: >
    When the session is about money — what something cost, a balance, a bill, a
    real cost per item — the verb is "Costo". Never "Analizar".
  examples:
    - { nnn: 2, subject: "Claude API", verb: "Costo" }
    - { nnn: 13, subject: "Pedido", verb: "Costo", tag2: "" }

- id: quoting-is-cotizar
  taught: 2026-11-09
  rule: >
    When the session prices a product or a service — Amazon, a marketplace, a
    local store, a supplier — the verb is "Cotizar". A quote is always about a
    Product or a Service, so the pillar is "Productos" or "Servicios".
  examples:
    - { nnn: 4, subject: "Precios", tag1: "Amazon", tag2: "Compras", pillar: "Productos", verb: "Cotizar" }
  control_question: "Was a price being quoted or compared? Then Cotizar."

- id: testing-not-verificar
  taught: 2026-11-09
  rule: >
    In a technical session where something is being exercised to see whether it
    works, the verb is "Testing", not "Verificar". "Verificar" confirms a fact;
    "Testing" exercises a system.
  examples:
    - { nnn: 3, subject: "Lisa", tag1: "Hermes Terminal", verb: "Testing" }

- id: problems-are-verbs
  taught: 2026-11-09
  rule: >
    A problem is an action the system failed at, not the subject. "Disco lleno"
    names the symptom; "Hard Drive" names the thing and "Falta de Espacio" names
    the failure. Problems live in the verb vocabulary.
  examples:
    - { nnn: 9, wrong_subject: "Disco lleno", right_subject: "Hard Drive", verb: "Falta de Espacio" }

- id: troubleshooting-only-on-complaint
  taught: 2026-11-08
  rule: >
    Tag2 is Troubleshooting only when the user reports something failing, or is
    determining whether a configuration he made actually works — not when the
    topic is merely mentioned.
  note: 98 candidates reviewed; 28 confirmed, 5 reverted.

- id: marketplace-verb
  taught: 2026-11-09
  rule: >
    For a marketplace evaluation the description ends with "· Comparar" when
    weighing options, "· Cotizar" when producing a price, "· Analizar" when
    reading a listing in depth.
  examples:
    - { nnn: 748, description_ends: "· Comparar" }

# --------------------------------------------------------------------------- #
# PRODUCTS
# --------------------------------------------------------------------------- #

- id: product-marketplace-shape
  taught: 2026-11-09
  rule: >
    When the session evaluates a product, Tag1 is the brand and Tag2 is the
    marketplace. Subject is the product itself.
  examples:
    - { nnn: 748, subject: "Air 2S", tag1: "DJI", tag2: "Ebay" }
    - { nnn: 812, subject: "Trace Minerals", tag1: "Dr. Berg", tag2: "Amazon" }
    - { nnn: 582, subject: "Case USB", tag1: "ORICO", tag2: "Comparación" }
  control_question: "Does the tag tell me who makes it, or where we looked?"

- id: product-shape
  taught: 2026-11-09
  rule: >
    For a product being evaluated or bought inside a marketplace session: the
    subject is the generic thing ("Teclado"), Tag1 is the brand ("Steren"),
    Tag2 is the MODEL ("COM-6900"), and the pillar is "Productos". The model is
    not part of the subject — it is the second tag, which is what distinguishes
    two otherwise identical items.
  examples:
    - { nnn: 8, wrong: "Teclado COM-6900 / Hermes Agent / Comparación", right: "Teclado / Steren / COM-6900 / Productos" }
  control_question: "Is this a thing someone buys? Then brand and model are tags."

- id: spec-belongs-to-its-machine
  taught: 2026-11-09
  rule: >
    When the subject is a component or specification of a piece of equipment,
    the subject is the concrete spec ("16 GB Ram") and Tag6 names the equipment
    ("Mac mini M4"). Tag6 is not only computers: a monitor, a blender, a washing
    machine, a book — anything a spec can belong to.
  examples:
    - { nnn: 5, wrong_subject: "Consumo Memoria", right_subject: "16 GB Ram", tag6: "Mac mini M4", verb: "Solucionar" }

# --------------------------------------------------------------------------- #
# TAGS
# --------------------------------------------------------------------------- #

- id: abbreviate-only-common-vocabulary
  taught: 2026-11-09
  rule: >
    Abbreviate when the long form is redundant for someone who lives in the
    domain: "MacOS Tahoe" is just "Tahoe". But NEVER abbreviate what is not
    common vocabulary: "Gorgon Halo" and "Strix Halo" mean nothing when
    shortened, so they stay whole and Tag1 carries the maker ("AMD").
  examples:
    - { long: "MacOS Tahoe", short: "Tahoe" }
    - { keep: "Gorgon Halo", tag1: "AMD" }
  control_question: "Would a knowledgeable reader lose meaning if I shorten this?"

- id: country-goes-in-its-own-tag
  taught: 2026-11-09
  rule: >
    For laws, decrees, the Official Gazette and constitutions, the country goes
    in the country tag, never in the subject. The subject stays "Constitución"
    so the concept can be filtered across countries.
  examples:
    - { nnn: 10, subject: "Constitución", country: "Panamá", tag1: "Hermes Agent", tag2: "Data Mining" }
    - { nnn: 11, subject: "Constitución", tag1: "Hermes Agent", tag2: "Data Mining", verb: "Organizar" }

- id: constitution-is-law-not-geopolitics
  taught: 2026-11-08
  rule: Panama's Constitution belongs to the Derecho pillar, not Geopolítica.
  examples:
    - { subject: "Constitución", pillar: "Derecho" }

- id: no-redundant-tag
  taught: 2026-11-09
  rule: >
    If Tag2 only repeats what the subject or Tag1 already says, leave it empty.
    A tag that adds nothing is noise in the filter list.
  examples:
    - { nnn: 13, subject: "Pedido", tag1: "Amazon", tag2: "", note: "Compras added nothing" }
  control_question: "Does this tag tell me something the subject and Tag1 did not?"

- id: subject-does-not-repeat-tag1
  taught: 2026-11-08
  rule: >
    If Tag1 is YouTube, the subject does not say "Video"; it says
    "Transcripción".
  examples:
    - { nnn: 12, wrong_subject: "Transcripción de Video", right_subject: "Transcripción", tag1: "YouTube" }

- id: pillar-never-in-title
  taught: 2026-11-08
  rule: >
    The pillar is a filter, never part of the title. Measured: including it
    leaves 877 of 884 titles with no description.
  examples:
    - { pillar: "Asistente IA", in_title: false }

- id: ventana-permisos-series
  taught: 2026-11-08
  rule: >
    Permission dialogs are a recurring theme across months of work, not a
    one-off. They form one series.
  examples:
    - { ssns: [10, 13, 90, 533, 720, 821, 877], subject: "Ventana Permisos", tag1: "Hermes Agent", tag2: "Data Security" }

# --------------------------------------------------------------------------- #
# LANGUAGE
# --------------------------------------------------------------------------- #

- id: bilingual-vocabulary
  taught: 2026-11-09
  rule: >
    The plugin is bilingual. The two initial languages are Spanish and English.
    Labels are produced in the language of the session. The owner may write in
    Spanish inside an English session, or the reverse (Spanglish); classify by
    meaning, not by the language of the first word.
  examples:
    - { mixed: "Lisa revisa el backup del VPS y dime el cost", language: "es" }
  control_question: "What did they mean, regardless of the language they said it in?"

# --------------------------------------------------------------------------- #
# SUBJECT AS A FILTER  (the algorithm evolved: the subject is now specific)
# --------------------------------------------------------------------------- #

- id: one-subject-only
  taught: 2026-11-09
  rule: >
    ONE subject per session. If several things are compared or mentioned, the
    subject is the main one and the rest go to the description. The subject is
    a FILTER now, so it must be short and repeatable — "Herdr + Ovis vs Multica"
    is not a filter, "Herdr" is.
  examples:
    - { nnn: 863, wrong_subject: "Herdr + Ovis vs Multica", right_subject: "Herdr", description: "comparar Herdr más Ovis contra Multica" }
  control_question: "Would I ever want to filter by this exact string again?"

- id: spec-goes-to-description
  taught: 2026-11-09
  rule: >
    An extra specification of the subject belongs in the description, not in
    the subject. "Gorgon Halo 192GB" should be "Gorgon Halo". EXCEPTION: when
    the specification IS the subject of the session ("16 GB Ram"), then it stays
    and Tag6 names the machine it belongs to.
  examples:
    - { nnn: 881, wrong_subject: "Gorgon Halo 192GB", right_subject: "Gorgon Halo", description: "servidor de 192GB, tarea cron de monitoreo" }
    - { nnn: 5, keep_subject: "16 GB Ram", tag6: "Mac mini M4" }
  control_question: "Is the session ABOUT the number, or about the thing that has the number?"

- id: brand-never-in-subject
  taught: 2026-11-09
  rule: >
    The brand goes in Tag1, never in the subject. "Dell Precision 7760" splits
    into Tag1 "Dell" and subject "Precision 7760". When Tag2 is "Review", the
    work is the agent evaluating something — that is what Tag2 says, not the
    subject.
  examples:
    - { nnn: 870, wrong_subject: "Dell Precision 7760", right_subject: "Precision 7760", tag1: "Dell", tag2: "Review" }

- id: third-party-program-is-tag1-not-subject
  taught: 2026-11-09
  rule: >
    A third-party program or skill is never the tag1 of a Hermes session, and
    not the subject either when the work is about evaluating it. The program
    goes in the description, the maker in Tag1 when it is known, and the subject
    is the thing being assessed. Never assign "Hermes Agent" to a session whose
    protagonist is someone else's software.
  examples:
    - { nnn: 871, program: "SkillSpector (Nvidia)", tag1: "Nvidia", subject: "Skill", description: "evaluar SkillSpector" }
    - { nnn: 872, wrong_subject: "Amenazas de Hermes", right_subject: "Hack History", note: "Hermes in the subject is redundant with tag1" }
  control_question: "Who is doing the work — my agent, or another company's software?"

- id: brand-equals-subject-exception
  taught: 2026-11-09
  rule: >
    The "subject must not repeat Tag1" rule has one exception: when the brand
    and the product share the same name and the subject adds a version or
    generation, the repetition is correct. "Ornith 2.0" with Tag1 "Ornith" is
    right — the version is the information, and inventing a synonym
    ("Lanzamiento 2.0") destroys the filter. Same for a model line whose name is
    the maker's name.
  examples:
    - { nnn: 243, right: "[Ornith 2.0] [Ornith]", wrong: "[Lanzamiento 2.0] [Ornith]" }
    - { rule_of_thumb: "If the only difference is a version, keep it." }
  control_question: "Is the extra token a version of the same name, or a different noun?"

- id: concept-vocabulary
  taught: 2026-11-09
  rule: >
    Some subjects are CONCEPTS the owner cares about across sessions, and the
    classifier must recognize them by name: "Hack History" (security history and
    threat archives, mostly from the OpenClaude world), "Ventana Permisos",
    "Protocolo". A concept is a permanent filter, not a description.
  examples:
    - { nnn: 872, subject: "Hack History", tag1: "Hermes Agent", tag2: "Data Security" }
  note: Concepts live in a growing glossary the prompt carries.

- id: harness-agent
  taught: 2026-11-09
  rule: >
    "Harness Agent" is the subject when the session is about the scaffolding a
    model runs inside — the loop, the tools, the permissions, the runtime — or
    when languages and platforms are compared by their ability to run agents.
    Never "Motor", never "Lenguaje".
  examples:
    - { nnn: 14, wrong: "Motor", right: "Harness Agent", tag1: "Hermes Agent", tag2: "Programming" }
  control_question: "Are we talking about the model, or about the machinery around it?"

- id: subject-is-a-point-not-a-sentence
  taught: 2026-11-09
  rule: >
    The subject is a POINT, not a sentence. It must not compete with the
    description. Four mechanical checks, run on every subject before it is
    written:
    (S1) no verb — "Comparación con Ollama", "Aprender a programar",
    "Buscar virus": the action belongs in the verb field;
    (S2) no linking preposition that turns the noun into a clause:
    " con ", " para ", " que ", " sobre ", " entre ", " desde ", " hasta ",
    " a ", " vs ", " versus ". ("Cierre de sesión" is fine: "de" names a thing.)
    (S3) length: median is 17 characters; past 26 is suspect, past 30 is a
    sentence in disguise;
    (S4) it never repeats Tag1 unless the difference is a version.
  examples:
    - { nnn: 98, wrong: "Serie samurái ciego", right: "Samurái Ciego", tag1: "Película", tag2: "Serie", country: "Japón" }
    - { nnn: 97, wrong: "Buscador open source", right: "Buscador OS" }
    - { nnn: 96, wrong: "Recordatorio demo", right: "Tarea Cron" }
    - { nnn: 95, wrong: "Aprender a programar", right: "Programming Language" }
    - { nnn: 93, wrong: "Comparación con Ollama", right: "Ollama" }
  control_question: "Could this be a filter chip someone clicks, or is it a heading?"
  audit: tools/audit_subjects.py

- id: subject-preposition-exception
  taught: 2026-11-09
  rule: >
    The "no linking preposition" rule has an exception: when the preposition is
    part of the CONCEPT'S OWN NAME. "Descuentos a Jubilados" is a benefit, a
    named thing — "a Jubilados" is its beneficiary, not a clause linking two
    objects. Contrast with "Comparación con Ollama", where "con" joins an action
    to its object: that one is a sentence in disguise.
  examples:
    - { nnn: 267, right: "Descuentos a Jubilados", wrong: "Descuentos jubilados hispanos" }
    - { allow: ["Descuentos a Jubilados", "Beneficios a Jubilados"] }
    - { forbid: ["Comparación con Ollama", "Reunión con alcaldes"] }
  control_question: "Is the phrase after the preposition the thing's own name, or a second object?"

- id: hermes-agent-is-not-the-default
  taught: 2026-11-09
  rule: >
    Do not assign "Hermes Agent" as Tag1 just because the agent ran the session.
    The subject is the PATIENT — the thing with the problem — and the agent is
    the tool. If the session is about another product's memory, state or health,
    that product is Tag1. "Memoria Persistente" belongs to HermesOffice, not to
    Hermes Agent. When in doubt, ask who is sick, not who is holding the chart.
  examples:
    - { nnn: 443, subject: "Memoria Persistente", tag1: "HermesOffice" }
  control_question: "Whose problem is this — mine, or someone else's?"

- id: vs-means-comparison
  taught: 2026-11-09
  rule: >
    Every time the owner asks to compare two things, or the requirement contains
    " vs ", "versus" or "frente a": Tag2 is "Comparación", the subject is the
    first thing compared, and the DESCRIPTION carries the full "A vs B". The
    comparison itself is never the subject.
  examples:
    - { nnn: 826, subject: "Mac Studio Ultra", tag1: "Apple", tag2: "Comparación", description: "Mac Studio Ultra vs RTX 5090" }
    - { nnn: 93, subject: "Ollama", tag2: "Comparación" }
  audit: scan every session for " vs ", "versus", "frente a", "comparar"

- id: lisa-is-the-subject
  taught: 2026-11-09
  rule: >
    When the session exercises the assistant itself — presenting it, testing
    whether it answers, checking its behaviour — the subject is the assistant's
    NAME ("Lisa"), and Tag2 is "Testing". Not "Presentación del agente", not
    "Identidad y modelo".
  examples:
    - { nnn: 143, subject: "Lisa", tag1: "Hermes Desktop", tag2: "Testing" }
    - { nnn: 144, subject: "Lisa", tag1: "Hermes Desktop", tag2: "Testing" }

- id: tag2-follows-the-context
  taught: 2026-11-09
  rule: >
    Tag2 is not inherited from the platform or the pillar: it is read from what
    the session actually does. A session about controlling CyberPanel over SSH
    and the safe ways to do it is "Data Security", not "VPS". When two families
    fit, choose the one that describes the WORK, not the place.
  examples:
    - { nnn: 336, subject: "SSH", tag1: "CyberPanel", tag2: "Data Security" }
  control_question: "What did we do — audit, install, compare, secure, migrate?"

- id: flight-path-vs-avata-360
  taught: 2026-11-09
  rule: >
    "Flight Path" (singular) is the trajectories; "Avata 360" is the drone.
    A session about programmable waypoints, their monitoring or their firmware
    is Flight Path. A session about the aircraft itself — its specs, its
    registration, its goggles, its purchase — is Avata 360. "Flight Paths",
    "Waypoints" and "paths programables" are the same subject and must not
    split the filter.
  examples:
    - { nnn: 157, subject: "Flight Path", tag1: "DJI", tag2: "Automation" }
    - { nnn: 773, subject: "Flight Path", tag1: "Antigravity A1" }
    - { nnn: 654, subject: "Avata 360", tag1: "DJI" }
    - { nnn: 802, subject: "Avata 360", tag1: "DJI" }
  control_question: "Is this about the aircraft, or about where it flies itself?"

- id: productos-vs-compras
  taught: 2026-11-09
  rule: >
    "Compras" is the LOGISTICS of buying: shipping, courier, customs, payment,
    supplier, tracking. "Productos" is the THING being priced: specs, speed,
    compatibility, comparisons, price watching, availability. A cron that
    watches a price is Productos, not Compras. Regulation about a product (an
    FAA ban, a licence) is neither: it belongs to the pillar of the domain.
  examples:
    - { nnn: 254, right: "Productos", why: "comparar RTX por memoria y ancho de banda" }
    - { nnn: 150, right: "Productos", why: "tarea que vigila el precio de un producto" }
    - { nnn: 366, right: "Temas Varios", why: "prohibición de la FAA: regulación, no compra" }
  control_question: "Am I moving the box, or judging what is inside it?"

- id: one-series-one-pillar
  taught: 2026-11-09
  rule: >
    A series that shares a subject shares its facets. The 43 Gorgon Halo
    sessions had three pillars (VPS, Compras, Asistente IA) and two families
    (VPS, Automation) for the same recurring task. When a subject already has
    a hundred siblings, the odd one out is wrong, not exceptional.
  examples:
    - { subject: "Gorgon Halo", nnn: 881, tag2: "Automation", pillar: "VPS" }
  control_question: "Does this look like its 42 siblings?"

- id: qualifier-is-not-identity
  taught: 2026-11-09
  rule: >
    When the subject reads "X <detail>" and the detail is a DOMAIN, an IP, an
    email or a file path, the subject is X and the detail belongs in the
    DESCRIPTION. A domain says *which one*, not *what it is*. The series is
    "DNS + Correo"; "DNS + Correo example.com" splits one series into as many
    chips as domains the owner has.
  exception: >
    If the detail IS the subject — a bare domain with no word in front, like
    "importadoralosangeles.net" — it stays: there is nothing to qualify.
  examples:
    - { nnn: 556, wrong: "DNS + Correo example.com", right: "DNS + Correo", description: "example.com — Revisar a las 8 am el DNS" }
    - { nnn: 467, wrong: "Correos example.com", right: "DNS + Correo" }
    - { nnn: 474, wrong: "Certificados example.com", right: "Certificados" }
    - { nnn: 379, wrong: "Dominio example.org", right: "Dominio" }
    - { nnn: 452, right: "importadoralosangeles.net", why: "el dominio ES el sujeto" }
  control_question: "Is the part after the space naming the subject, or narrowing it?"
  applies_to: [domain, ip, email, file path, hostname]

- id: spelling-variants-are-one-subject
  taught: 2026-11-09
  rule: >
    Two spellings of the same thing are ONE subject, never two. "DNS y Correo"
    and "DNS + Correo" are the same series; "Correos" and "Correo" are the same
    noun. Normalise to the form the owner uses most, then renumber the series so
    the MMM stays gapless.
  examples:
    - { variants: ["DNS y Correo", "DNS + Correo", "Correos", "Correo"], canonical: "DNS + Correo" }
  control_question: "Would a reader click these two chips expecting different things?"
