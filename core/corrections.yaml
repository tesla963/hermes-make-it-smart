# Corrections taught by the owner.
# Every entry is a rule AND the evidence that taught it.
# Rendered into the classifier prompt as few-shot examples and mirrored in tests/eval/.
#
# The rule is what generalizes. The example is what proves it. The control
# question is what to ask when the rule does not obviously apply.

# --------------------------------------------------------------------------- #
# NAMES
# --------------------------------------------------------------------------- #

- id: name-the-agent
  taught: 2026-11-09
  rule: >
    The assistant has a name the owner chose. When the session is about the
    assistant itself — its identity, its availability, whether it responds —
    the subject is that NAME (whatever the owner chose), never a paraphrase like "Disponibilidad
    del asistente" or "Identidad y modelo". Call things by their name.
  examples:
  control_question: "Is the owner talking TO the assistant, or ABOUT something else?"

- id: full-product-names
  taught: 2026-11-08
  rule: >
    Never abbreviate the host's own names: Hermes Agent, Hermes Desktop,
    Hermes Terminal, Hermes Telegram. Never a bare "Hermes".
  examples:
    - { right: "Hermes Agent", wrong: "Hermes" }

- id: ia-short-form
  taught: 2026-11-08
  rule: >
    Use "IA" in titles, not "Inteligencia Artificial": 22 characters eat the
    description and leave 96 titles with no text. The search bridges all forms.
  bridge: ["IA", "AI", "Inteligencia Artificial", "Artificial Intelligence"]

# --------------------------------------------------------------------------- #
# SUBJECT
# --------------------------------------------------------------------------- #

- id: subject-is-never-the-program
  taught: 2026-11-07
  rule: >
    The subject names the object, problem or symptom. The platform goes in Iq1.
    If they are nearly the same, something is wrong.
  examples:
  note: 187 sessions corrected on this rule.

- id: subject-never-carries-the-action
  taught: 2026-11-09
  rule: >
    The subject is the actor or the object, never the action done to it.
    "Indexación Spotlight" is wrong; the subject is "Spotlight".
  examples:

- id: subject-strips-action-prefix
  taught: 2026-11-08
  rule: Strip the action prefix; the verb belongs at the end of the description.
  examples:
    - { wrong: "Suplemento Vitamina C", right: "Vitamina C" }
    - { wrong: "Dolor Interoseos", right: "Interoseos" }
    - { wrong: "Auto-arranque Gateway Telegram", right: "Gateway Telegram" }

- id: failure-point-naming
  taught: 2026-11-08
  rule: >
    Name the point of failure, not the component. A broken gateway is
    "Protocolo"; a permission dialog is "Ventana Permisos".
  examples:

# --------------------------------------------------------------------------- #
# THE VERB DECIDES THE SUBJECT
# --------------------------------------------------------------------------- #

- id: verb-first-then-subject
  taught: 2026-11-09
  rule: >
    Decide the verb FIRST, then shape the subject around it. The verb tells you
    what kind of noun the subject must be: a thing (Costo → "Pedido"), the actor
    being tested (Testing → the agent's name), a failing part (Falta de Espacio →
    "Hard Drive"). A subject chosen before the verb is usually the wrong noun.
  examples:
    - { verb: "Costo", subject: "Pedido" }
    - { verb: "Falta de Espacio", subject: "Hard Drive" }
    - { verb: "Cotizar", subject: "Precios" }
  control_question: "What action was taken — and what noun does that action demand?"

- id: money-verb-is-costo
  taught: 2026-11-09
  rule: >
    When the session is about money — what something cost, a balance, a bill, a
    real cost per item — the verb is "Costo". Never "Analizar".
  examples:

- id: quoting-is-cotizar
  taught: 2026-11-09
  rule: >
    When the session prices a product or a service — Amazon, a marketplace, a
    local store, a supplier — the verb is "Cotizar". A quote is always about a
    Product or a Service, so the pillar is "Productos" or "Servicios".
  examples:
  control_question: "Was a price being quoted or compared? Then Cotizar."

- id: testing-not-verificar
  taught: 2026-11-09
  rule: >
    In a technical session where something is being exercised to see whether it
    works, the verb is "Testing", not "Verificar". "Verificar" confirms a fact;
    "Testing" exercises a system.
  examples:

- id: problems-are-verbs
  taught: 2026-11-09
  rule: >
    A problem is an action the system failed at, not the subject. "Disco lleno"
    names the symptom; "Hard Drive" names the thing and "Falta de Espacio" names
    the failure. Problems live in the verb vocabulary.
  examples:

- id: troubleshooting-only-on-complaint
  taught: 2026-11-08
  rule: >
    Iq3 is Troubleshooting only when the user reports something failing, or is
    determining whether a configuration he made actually works — not when the
    topic is merely mentioned.
  note: 98 candidates reviewed; 28 confirmed, 5 reverted.

- id: marketplace-verb
  taught: 2026-11-09
  rule: >
    For a marketplace evaluation the description ends with "· Comparar" when
    weighing options, "· Cotizar" when producing a price, "· Analizar" when
    reading a listing in depth.
  examples:

# --------------------------------------------------------------------------- #
# PRODUCTS
# --------------------------------------------------------------------------- #

- id: product-marketplace-shape
  taught: 2026-11-09
  rule: >
    When the session evaluates a product, Iq1 is the brand and Iq2 is the
    marketplace. Subject is the product itself.
  examples:
  control_question: "Does the axis tell me who makes it, or where we looked?"

- id: product-shape
  taught: 2026-11-09
  rule: >
    For a product being evaluated or bought inside a marketplace session: the
    subject is the generic thing ("Teclado"), Iq1 is the brand ("Steren"),
    the MODEL ("COM-6900") trails the subject in the description, and the theme is
    "Productos". The model is
    not part of the subject — it is the second axis, which is what distinguishes
    two otherwise identical items.
  examples:
  control_question: "Is this a thing someone buys? Then brand and model are axes."

- id: spec-belongs-to-its-machine
  taught: 2026-11-09
  rule: >
    When the subject is a component or specification of a piece of equipment,
    the subject is the concrete spec ("16 GB Ram") and Iq2 names the equipment
    ("Mac mini M4"). Iq2 is not only computers: a monitor, a blender, a washing
    machine, a book — anything a spec can belong to.
  examples:

# --------------------------------------------------------------------------- #
# TAGS
# --------------------------------------------------------------------------- #

- id: abbreviate-only-common-vocabulary
  taught: 2026-11-09
  rule: >
    Abbreviate when the long form is redundant for someone who lives in the
    domain: "MacOS Tahoe" is just "Tahoe". But NEVER abbreviate what is not
    common vocabulary: "Gorgon Halo" and "Strix Halo" mean nothing when
    shortened, so they stay whole and Iq1 carries the maker ("AMD").
  examples:
    - { long: "MacOS Tahoe", short: "Tahoe" }
    - { keep: "Gorgon Halo", iq1: "AMD" }
  control_question: "Would a knowledgeable reader lose meaning if I shorten this?"

- id: country-goes-in-its-own-tag
  taught: 2026-11-09
  rule: >
    For laws, decrees, the Official Gazette and constitutions, the country goes
    in the country axis, never in the subject. The subject stays "Constitución"
    so the concept can be filtered across countries.
  examples:

- id: constitution-is-law-not-geopolitics
  taught: 2026-11-08
  rule: Panama's Constitution belongs to the Derecho pillar, not Geopolítica.
  examples:
    - { subject: "Constitución", pillar: "Derecho" }

- id: no-redundant-tag
  taught: 2026-11-09
  rule: >
    If Iq2 only repeats what the subject or Iq1 already says, leave it empty.
    An axis that adds nothing is noise in the filter list.
  examples:
  control_question: "Does this axis tell me something the subject and Iq1 did not?"

- id: subject-does-not-repeat-iq1
  taught: 2026-11-08
  rule: >
    If Iq1 is YouTube, the subject does not say "Video"; it says
    "Transcripción".
  examples:

- id: pillar-never-in-title
  taught: 2026-11-08
  rule: >
    The pillar is a filter, never part of the title. Measured: including it
    leaves 877 of 884 titles with no description.
  examples:
    - { pillar: "Asistente IA", in_title: false }

- id: ventana-permisos-series
  taught: 2026-11-08
  rule: >
    Permission dialogs are a recurring theme across months of work, not a
    one-off. They form one series.
  examples:
    - { ssns: [10, 13, 90, 533, 720, 821, 877], subject: "Ventana Permisos", iq1: "Hermes Agent", iq2: "Data Security" }

# --------------------------------------------------------------------------- #
# LANGUAGE
# --------------------------------------------------------------------------- #

- id: bilingual-vocabulary
  taught: 2026-11-09
  rule: >
    The plugin is bilingual. The two initial languages are Spanish and English.
    Labels are produced in the language of the session. The owner may write in
    Spanish inside an English session, or the reverse (Spanglish); classify by
    meaning, not by the language of the first word.
  examples:
    - { mixed: "revisa el backup del VPS y dime el costo", language: "es" }
  control_question: "What did they mean, regardless of the language they said it in?"

# --------------------------------------------------------------------------- #
# SUBJECT AS A FILTER  (the algorithm evolved: the subject is now specific)
# --------------------------------------------------------------------------- #

- id: one-subject-only
  taught: 2026-11-09
  rule: >
    ONE subject per session. If several things are compared or mentioned, the
    subject is the main one and the rest go to the description. The subject is
    a FILTER now, so it must be short and repeatable — "Herdr + Ovis vs Multica"
    is not a filter, "Herdr" is.
  examples:
  control_question: "Would I ever want to filter by this exact string again?"

- id: spec-goes-to-description
  taught: 2026-11-09
  rule: >
    An extra specification of the subject belongs in the description, not in
    the subject. "Gorgon Halo 192GB" should be "Gorgon Halo". EXCEPTION: when
    the specification IS the subject of the session ("16 GB Ram"), then it stays
    and Iq6 names the machine it belongs to.
  examples:
  control_question: "Is the session ABOUT the number, or about the thing that has the number?"

- id: brand-never-in-subject
  taught: 2026-11-09
  rule: >
    The brand goes in Iq1, never in the subject. "Dell Precision 7760" splits
    into Iq1 "Dell" and subject "Precision 7760". When Iq2 is "Review", the
    work is the agent evaluating something — that is what Iq2 says, not the
    subject.
  examples:

- id: third-party-program-is-iq1-not-subject
  taught: 2026-11-09
  rule: >
    A third-party program or skill is never the iq1 of a Hermes session, and
    not the subject either when the work is about evaluating it. The program
    goes in the description, the maker in Iq1 when it is known, and the subject
    is the thing being assessed. Never assign "Hermes Agent" to a session whose
    protagonist is someone else's software.
  examples:
  control_question: "Who is doing the work — my agent, or another company's software?"

- id: brand-equals-subject-exception
  taught: 2026-11-09
  rule: >
    The "subject must not repeat Iq1" rule has one exception: when the brand
    and the product share the same name and the subject adds a version or
    generation, the repetition is correct. "Ornith 2.0" with Iq1 "Ornith" is
    right — the version is the information, and inventing a synonym
    ("Lanzamiento 2.0") destroys the filter. Same for a model line whose name is
    the maker's name.
  examples:
    - { rule_of_thumb: "If the only difference is a version, keep it." }
  control_question: "Is the extra token a version of the same name, or a different noun?"

- id: concept-vocabulary
  taught: 2026-11-09
  rule: >
    Some subjects are CONCEPTS the owner cares about across sessions, and the
    classifier must recognize them by name: "Hack History" (security history and
    threat archives, mostly from the OpenClaude world), "Ventana Permisos",
    "Protocolo". A concept is a permanent filter, not a description.
  examples:
  note: Concepts live in a growing glossary the prompt carries.

- id: harness-agent
  taught: 2026-11-09
  rule: >
    "Harness Agent" is the subject when the session is about the scaffolding a
    model runs inside — the loop, the tools, the permissions, the runtime — or
    when languages and platforms are compared by their ability to run agents.
    Never "Motor", never "Lenguaje".
  examples:
  control_question: "Are we talking about the model, or about the machinery around it?"

- id: subject-is-a-point-not-a-sentence
  taught: 2026-11-09
  rule: >
    The subject is a POINT, not a sentence. It must not compete with the
    description. Four mechanical checks, run on every subject before it is
    written:
    (S1) no verb — "Comparación con Ollama", "Aprender a programar",
    "Buscar virus": the action belongs in the verb field;
    (S2) no linking preposition that turns the noun into a clause:
    " con ", " para ", " que ", " sobre ", " entre ", " desde ", " hasta ",
    " a ", " vs ", " versus ". ("Cierre de sesión" is fine: "de" names a thing.)
    (S3) length: median is 17 characters; past 26 is suspect, past 30 is a
    sentence in disguise;
    (S4) it never repeats Iq1 unless the difference is a version.
  examples:
  control_question: "Could this be a filter chip someone clicks, or is it a heading?"
  audit: tools/audit_subjects.py

- id: subject-preposition-exception
  taught: 2026-11-09
  rule: >
    The "no linking preposition" rule has an exception: when the preposition is
    part of the CONCEPT'S OWN NAME. "Descuentos a Jubilados" is a benefit, a
    named thing — "a Jubilados" is its beneficiary, not a clause linking two
    objects. Contrast with "Comparación con Ollama", where "con" joins an action
    to its object: that one is a sentence in disguise.
  examples:
    - { allow: ["Descuentos a Jubilados", "Beneficios a Jubilados"] }
    - { forbid: ["Comparación con Ollama", "Reunión con alcaldes"] }
  control_question: "Is the phrase after the preposition the thing's own name, or a second object?"

- id: hermes-agent-is-not-the-default
  taught: 2026-11-09
  rule: >
    Do not assign "Hermes Agent" as Iq1 just because the agent ran the session.
    The subject is the PATIENT — the thing with the problem — and the agent is
    the tool. If the session is about another product's memory, state or health,
    that product is Iq1. "Memoria Persistente" belongs to HermesOffice, not to
    Hermes Agent. When in doubt, ask who is sick, not who is holding the chart.
  examples:
  control_question: "Whose problem is this — mine, or someone else's?"

- id: vs-means-comparison
  taught: 2026-11-09
  rule: >
    Every time the owner asks to compare two things, or the requirement contains
    " vs ", "versus" or "frente a": Iq3 is "Comparar", the subject is the
    first thing compared, and the DESCRIPTION carries the full "A vs B". The
    comparison itself is never the subject.
  examples:
  audit: scan every session for " vs ", "versus", "frente a", "comparar"

- id: assistant-name-is-the-subject
  taught: 2026-11-09
  rule: >
    When the session exercises the assistant itself — presenting it, testing
    whether it answers, checking its behaviour — the subject is the assistant's
    NAME (the agent's name), and Iq2 is "Testing". Not "Presentación del agente", not
    "Identidad y modelo".
  examples:

- id: iq2-follows-the-context
  taught: 2026-11-09
  rule: >
    Iq2 is not inherited from the platform or the pillar: it is read from what
    the session actually does. A session about controlling CyberPanel over SSH
    and the safe ways to do it is "Data Security", not "VPS". When two families
    fit, choose the one that describes the WORK, not the place.
  examples:
  control_question: "What did we do — audit, install, compare, secure, migrate?"

- id: flight-path-vs-avata-360
  taught: 2026-11-09
  rule: >
    "Flight Path" (singular) is the trajectories; "Avata 360" is the drone.
    A session about programmable waypoints, their monitoring or their firmware
    is Flight Path. A session about the aircraft itself — its specs, its
    registration, its goggles, its purchase — is Avata 360. "Flight Paths",
    "Waypoints" and "paths programables" are the same subject and must not
    split the filter.
  examples:
  control_question: "Is this about the aircraft, or about where it flies itself?"

- id: productos-vs-compras
  taught: 2026-11-09
  rule: >
    "Compras" is the LOGISTICS of buying: shipping, courier, customs, payment,
    supplier, tracking. "Productos" is the THING being priced: specs, speed,
    compatibility, comparisons, price watching, availability. A cron that
    watches a price is Productos, not Compras. Regulation about a product (an
    FAA ban, a licence) is neither: it belongs to the pillar of the domain.
  examples:
  control_question: "Am I moving the box, or judging what is inside it?"

- id: one-series-one-pillar
  taught: 2026-11-09
  rule: >
    A series that shares a subject shares its facets. The 43 Gorgon Halo
    sessions had three pillars (VPS, Compras, Asistente IA) and two families
    (VPS, Automation) for the same recurring task. When a subject already has
    a hundred siblings, the odd one out is wrong, not exceptional.
  examples:
  control_question: "Does this look like its 42 siblings?"

- id: qualifier-is-not-identity
  taught: 2026-11-09
  rule: >
    When the subject reads "X <detail>" and the detail is a DOMAIN, an IP, an
    email or a file path, the subject is X and the detail belongs in the
    DESCRIPTION. A domain says *which one*, not *what it is*. The series is
    "DNS + Correo"; "DNS + Correo example.com" splits one series into as many
    chips as domains the owner has.
  never_a_subject: >
    A domain is NEVER the subject, not even alone. If the session is only about a
    domain, the subject is the PROBLEM the domain has — "Sitio Web", "DNS + Correo",
    "Certificado", "Disponibilidad" — and the domain goes in the description.
    Putting a domain in the subject breaks the same rule it was meant to follow:
    a domain says *which one*, never *what is wrong*.
  examples:
  control_question: "Is the part after the space naming the subject, or narrowing it?"
  applies_to: [domain, ip, email, file path, hostname]

- id: spelling-variants-are-one-subject
  taught: 2026-11-09
  rule: >
    Two spellings of the same thing are ONE subject, never two. "DNS y Correo"
    and "DNS + Correo" are the same series; "Correos" and "Correo" are the same
    noun. Normalise to the form the owner uses most, then renumber the series so
    the MMM stays gapless.
  examples:
    - { variants: ["DNS y Correo", "DNS + Correo", "Correos", "Correo"], canonical: "DNS + Correo" }
  control_question: "Would a reader click these two chips expecting different things?"

- id: brand-and-product-are-two-things
  taught: 2026-11-09
  rule: >
    When a brand owns a product with its own name, they are two things:
    Iq1 is the brand, the subject is the product. "USPS Ground Advantage" is
    Iq1 "USPS" with subject "Ground Advantage". The same holds for "FedEx
    Ground", "UPS Ground", "DHL Express", "Adobe Acrobat", "Microsoft 365".
    A brand never stays inside a subject when the product can stand alone.
  examples:
  control_question: "If I remove the brand from the name, does the product still name itself?"
  cheat_sheet: core/cheat_sheet.yaml → logistica

# ---------------------------------------------------------------------------
# EL PROTOCOLO DE ANÁLISIS
# ---------------------------------------------------------------------------
# Cuatro reglas que nacieron de una sola revisión (00100, 071, 397, 369, 353) y
# que ordenan el trabajo en capas: el script decide lo que sabe, el LLM
# investiga lo que no, y nadie adivina lo que se puede comprobar.
# ---------------------------------------------------------------------------

- id: subject-is-the-nearest-item
  taught: 2026-11-10
  rule: >
    When the turn asks whether A works with B, the subject is the item CLOSEST TO
    THE USER — the one he already owns or is about to use — never the accessory
    under evaluation. Asking "do these RayNeo glasses work with my DJI RC 2"
    is a session about the RC 2: the controller is the thing he flies, the
    glasses are the candidate. Iq1 is the program or maker behind the subject
    (DJI), and the candidate goes in the description with its brand intact.
  why: >
    The old rule keyed on brand and turned every DJI-adjacent session into
    "[DJI]" with the wrong subject. The brand is an attribute of the subject,
    not a magnet that pulls all of its products into one pile.
  examples:
  control_question: "Which of the two does the user already hold in his hand?"

- id: brand-of-a-program-comes-from-its-site
  taught: 2026-11-10
  rule: >
    For a programme or app, the brand is the COMPANY behind it, and that is
    found at the programme's official site — not in the programme's own name.
    DEVONthink is the programme; devontechnologies.com says the company is
    Devon Technologies, so Iq1 is "Devon Technologies" and the subject stays
    "DEVONthink". When the script cannot name the company from the cheat sheet, it
    asks the model to look up the official site before it names anything.
  examples:
  control_question: "Whose site is the download page on?"

- id: iq2-carries-the-intent
  taught: 2026-11-10
  rule: >
    Iq3 names the kind of work the user actually asked for, in the tense of the
    request, and it is one of exactly seven: Comparar, Instalar, Investigar,
    Testear, Cotizar, Troubleshooting, Compatibilidad. "Instalar" when he is
    installing something, when he asks what a programme can do or whether a
    release exists; "Investigar" when he has a question and no object yet;
    "Testear" when something has to be confirmed; "Cotizar" when money is at
    stake — a price to pay or a cost already paid; "Compatibilidad" when he asks
    whether two things work together; "Troubleshooting" when something is
    broken, misconfigured or unbacked. The older names (Update, Version,
    Feature, Costo, Administrar, Respaldar, Comparación, Diagnosticar) are not
    axes: each is a signal of the canonical intention it belongs to.
    A generic family ("Electronica", "IA") is what Iq2 says when the intent was
    never read — not what it says when the intent is obvious.
  examples:
  control_question: "What verb would the user put in front of this session if he named it himself?"

- id: python-decides-llm-investigates
  taught: 2026-11-10
  rule: >
    Analysis runs in two layers, and the cheap one goes first. The script reads
    the title, the axes and the cheat sheet and resolves everything it can match —
    a known brand, a known product, a known intent. Only what is still unknown
    is handed to the model, and it is handed a QUESTION ("which company owns
    devonthink.com? is RayNeo one word?") rather than the whole transcript.
    The model's answer is written back to the cheat sheet, so the next session with
    that name costs no tokens at all.
  why: >
    Sending 884 full transcripts to a model to re-derive what a YAML file
    already knows is how a catalogue becomes expensive and slow. The cheat sheet is
    the cache of what has already been learned.
  control_question: "Does the cheat sheet already answer this? Then why is the model being asked?"

- id: two-layers-actors-then-intent
  taught: 2026-11-10
  rule: >
    The title is built in two passes, and they are not interchangeable.
    PASS ONE, the script: find the ACTORS. Who is named in the session — the
    product, the programme, the maker — using the cheat sheet as a dictionary. This
    is deterministic, free and repeatable; it never asks a model and never
    invents a brand. PASS TWO, the model: the INTENTION. Given the actors as
    settled facts, the one question left is what the user wanted done, answered
    with a single word from a closed vocabulary. The model is never asked to
    name anything, because naming is the half that can be looked up.
  why: >
    Asking the model for everything produced brands inside Iq1 ("DJI Avata 360"),
    products swallowed by their maker ("[DJI]" for a controller comparison) and a
    Iq2 that described a topic instead of an intention ("Electronica" where the
    user was installing a box he had just received). The names were knowable; the
    model was being asked to guess what a YAML file already held.
  examples:
  layers:
    script: core/actors.py — find_actors(), subject_candidate(), brand_of_subject()
    intent: core/intent.py — classify_intent() by keywords, prompt_for_intent() for the rest
    tests:  tests/test_protocol.py — the five cases above, pinned
  control_question: >
    Did the script have this name in the cheat sheet? Then the model must not be
    asked for it. Did the script have no signal for the verb? Then the model
    must be asked for exactly that, and nothing else.

- id: intent-not-topic
  taught: 2026-11-10
  rule: >
    Iq3 is the verb, never the shelf. "Electronica" is where the object would
    sit in a shop; "Instalar" is what the user did with it. When a Iq2 could
    describe a hundred unrelated sessions, it is not an axis — it is a category
    that escaped.
  examples:
  control_question: "Could this same Iq2 label a session about something completely different?"

# --------------------------------------------------------------------------- #
# THE STRUCTURE (2026-11-10). This rule outranks every older axis rule.
# --------------------------------------------------------------------------- #

# The id keeps the word 'tag' on purpose: it is a stable key referenced by docs and by
# the owner's personal overrides. Since v0.27.0 the axes are iq1…iq9.
- id: tag-structure-2026-11-10
  taught: 2026-11-10
  rule: >
    The five axes have ONE meaning each, and an older rule that says otherwise
    is superseded. iq1 is the PROGRAM the work happens in — or the program the
    work is about — never a bare adjective and never the assistant by default.
    The program goes in iq1 only when the subject is a part of it; when the
    intention makes the program the object of the work, the program IS the
    subject (iq0) and iq1 carries the company or the author. iq2 is CONTEXT and
    only context: a store ("Ebay", "Amazon"), a
    country ("Panamá") or a machine ("Mac mini M4"). iq3 is the INTENTION and
    nothing else, one of exactly seven: Troubleshooting, Web Search,
    Compatibility, Buy, Quote, Compare, Configuration. "Investigar" no longer
    exists: the verb is "Web Search". "Install" is not a separate intention
    either: Configuration implies installation. iq4 is the THEME, with the
    subcategories of IT Manager. iq5 is the year. The model carries nine slots and
    slots 6 to 9 are reserved; the machine belongs in iq2, not in iq6. An intention ("Comparar"), a family ("WebHosting") or a
    theme ("Hardware") in iq2 is an error, not a judgement call. When a field
    has nothing honest to say, leave it empty: an empty field is data, a filled
    one that lies is not.
  examples:
  control_question: "Is the value I am about to write in iq2 a store, a country or a machine — or is it something else wearing its clothes?"

# --------------------------------------------------------------------------- #
# SUBJECT SHAPE AND PROGRAM PLACEMENT (taught 2026-11-12)
# --------------------------------------------------------------------------- #

- id: subject-three-words-max
  taught: 2026-11-12
  rule: >
    A subject of four words or more is not a subject, it is a description that
    leaked into iq0. Measured over 873 sessions: 23 carry a four-word-or-longer
    subject (2.6 %) and every one is a phrase. The subject is 1 to 3 words, no
    verb, no greeting. If a verb appears ("abrir", "instalar", "consultar",
    "esta funcionando"), the action goes to the description or to the
    " · Verb" appendix and the subject keeps only the thing.
  examples:
    - { right: "Brave", wrong: "brave no esta abriendo" }
    - { right: "DeepSeek", wrong: "Hola DeepSeek estás funcionando" }
    - { right: "Antigravity", wrong: "Instalar y configurar Antigravity" }
    - { right: "Migración", wrong: "Migración Android a iPhone" }
  control_question: "Could this subject be a shelf label? If it needs a verb to make sense, it is a description."

- id: intent-decides-where-the-program-sits
  taught: 2026-11-12
  rule: >
    The same program can be the subject (iq0) or the axis (iq1). It is the
    INTENTION (iq3) that decides, never taste. When the intention makes the
    program the OBJECT of the work — Investigar, Comparar, Cotizar — the program
    is iq0 and iq1 carries the company or the author. When the intention works
    INSIDE the program — Troubleshooting, Configuration — the program is
    the container and goes to iq1, and iq0 names the part that broke. When the
    program is iq0, iq1 is not left empty: it carries the company that makes the
    program or the name of its author.
  examples:
    - { right: "Firefox · — · Investigar", wrong: "— · Firefox · Investigar" }
    - { right: "Stuck Startup · Firefox · Troubleshooting", wrong: "Firefox · — · Troubleshooting" }
    - { right: "Protocol · Hermes Gateway · Troubleshooting", wrong: "Hermes Gateway · — · Troubleshooting" }
  control_question: "Am I looking AT the program, or at a part of it that is misbehaving?"

- id: program-in-iq1-needs-a-part
  taught: 2026-11-12
  rule: >
    A program belongs in iq1 only when the subject can be named as a part of it
    ("Protocol" inside "Hermes Gateway", "Stuck Startup" inside "Firefox",
    "Hermes Desktop" inside "Hermes Agent"). If no part can be named, the program
    is not an axis: it is the subject, and the session has no iq1. A program in
    iq1 with an empty or identical subject is a field answering the same
    question twice.
  examples:
    - { right: "Hermes Desktop · Hermes Agent", wrong: "Hermes Agent · Hermes Agent" }
    - { right: "Protocol · Hermes Gateway", wrong: "— · Hermes Gateway" }
  control_question: "Name the part. If I cannot name it, why is the whole program in iq1?"

- id: install-folds-into-configuration
  taught: 2026-11-12
  rule: >
    "Install" is not an intention of its own. Configuration implies installation:
    you cannot configure what you did not install. When a session is about
    putting something in place, the intention is Configuration, whether the work
    ended at the install or went on to the settings.
  examples:
    - { right: "Configuration", wrong: "Install" }
    - { right: "Configuration", wrong: "Instalar" }
  control_question: "Could I configure it without installing it? If not, the intention is Configuration."

- id: search-the-web-not-investigar
  taught: 2026-11-12
  rule: >
    The intention for looking something up is "Web Search", in English. The
    old "Investigar" is retired. It covers consulting, researching and web
    searching; it does not cover reading a local document, which is Analysis.
  examples:
    - { right: "Web Search", wrong: "Investigar" }
    - { right: "Web Search", wrong: "Consultar" }
  control_question: "Am I going out to find something I do not know, or am I reading something I already have?"

- id: reparar-folds-into-troubleshooting
  taught: 2026-11-12
  rule: >
    "Reparar" is not an intention of its own. Troubleshooting implies repairing,
    fixing, mending: you cannot repair what you have not diagnosed. Repairing is
    what troubleshooting produces, so both verbs land on Troubleshooting.
  examples:
    - { right: "Troubleshooting", wrong: "Reparar" }
    - { right: "Troubleshooting", wrong: "Arreglar" }
    - { right: "Troubleshooting", wrong: "Fixing" }
  control_question: "Do I know the cause? If I do not, it is Troubleshooting — and the fix is its outcome, not a second intention."

- id: program-in-iq0-fills-iq1-with-its-maker
  taught: 2026-11-12
  rule: >
    When the program sits in iq0 as the subject, iq1 must name the COMPANY that
    makes it or the AUTHOR who wrote it. Never the program again — that would be
    one answer in two fields — and never an empty slot, because the field is
    there to say who stands behind the thing. A program with no company and no
    author gets no iq1, but that is the exception, not the default.
  why: >
    It closes the only hole left by "the program may be the subject": if iq0 takes
    the program, the axis loses its natural tenant. The company or the author
    takes the seat, and the pair reads as one idea — the product and who makes it.
  examples:
    - { subject: "Firefox", iq1: "Mozilla" }
    - { subject: "Antigravity", iq1: "Google" }
    - { subject: "Brave", iq1: "Brave Software" }
    - { subject: "Logseq", iq1: "Logseq Inc" }
    - { subject: "Hermes Agent", iq1: "Nous Research" }
    - { right: "Firefox · Mozilla · Web Search", wrong: "Firefox · — · Web Search" }
    - { right: "Firefox · Mozilla · Web Search", wrong: "Firefox · Firefox · Web Search" }
  control_question: "Who makes this program? That name goes in iq1 — never the program a second time."

- id: product-in-iq0-puts-brand-in-iq1
  taught: 2026-11-12
  rule: >
    The pair is always narrow + wide, in that order. When iq0 names the product,
    the model or the codename, iq1 names the BRAND that makes it. The brand is
    the amplifier of the product: without it, "Avata 360" could be anything;
    with it, the session is findable. This is the shape the catalogue already
    uses (80 sessions): Gorgon Halo · AMD, Avata 360 · DJI, ThinkPad P53 ·
    Lenovo, Case USB · ORICO.
  examples:
    - { right: "Gorgon Halo · AMD", wrong: "AMD · Gorgon Halo" }
    - { right: "Avata 360 · DJI", wrong: "DJI · Avata 360" }
    - { right: "ThinkPad P53 · Lenovo", wrong: "Lenovo · ThinkPad P53" }
    - { right: "V4 Flash · DeepSeek", wrong: "DeepSeek · V4 Flash" }
  control_question: "Which of the two words is the narrower one? The narrower goes in iq0, the wider in iq1."

- id: brand-can-be-the-subject-and-iq1-amplifies-it
  taught: 2026-11-12
  rule: >
    A brand CAN be the subject, and it is not an exception to the rules — it is
    the same narrow + wide pair turned around. When the session is about the
    brand itself (its catalogue, its strategy, whether to stay with it, its
    reputation), iq0 is the brand and iq1 is the AMPLIFIER: the product, the
    line or the model the brand is being discussed through — "Apple · Mac mini
    M4", "DJI · Avata 360", "AMD · Ryzen". The intention (iq3) and the context
    (iq2) keep their own seats and are not touched by this: the brand changes
    WHO is in iq0 and iq1, never why or where.
    One case is exempt and must be written down: when the session covers the
    brand as a whole, with no product to narrow it, iq1 stays empty. The maker
    of a brand is the brand, so filling iq1 with it would be the same word in
    two fields — the one thing that is always an error.
  examples:
    - { right: "Apple · Mac mini M4 · Compare", wrong: "Apple · Apple · Compare" }
    - { right: "DJI · Avata 360 · Quote", wrong: "DJI · — · Quote" }
    - { right: "Apple · — · Compare", note: "the whole brand, nothing to narrow it" }
    - { right: "DJI · — · Web Search", note: "brand strategy: no product yet" }
  control_question: "Am I talking about one thing this brand makes, or about the brand itself? If the brand is the subject, what narrows it goes in iq1."

# --------------------------------------------------------------------------- #
# WHAT COUNTS AS VOCABULARY (taught 2026-11-12)
# --------------------------------------------------------------------------- #

- id: a-model-is-never-alone
  taught: 2026-11-12
  rule: >
    A model number is not vocabulary on its own: it means nothing without the
    brand that makes it and the kind of object it is. A55 is not a term — it is
    Samsung (iq1) + Celular Android (iq2) + A55 (iq0). T1000 is not a term — it
    is Turing T1000, Nvidia (iq1) + Tarjeta Gráfica (iq2). Avata 360 is DJI
    (iq1) + Drone (iq2). PRO 495 192GB is AMD (iq1) + Desktop (iq2) + Buy (iq3).
    A bare model number or codename is a fragment, and a fragment in the
    vocabulary is a filter nobody can use.
  examples:
    - { right: "A55 · Samsung · Celular Android", wrong: "A55" }
    - { right: "Turing T1000 · Nvidia · Tarjeta Gráfica", wrong: "T1000" }
    - { right: "Avata 360 · DJI · Drone", wrong: "avata360" }
    - { right: "PRO 495 · AMD · Desktop", wrong: "PRO 495 192GB" }
    - { right: "ThinkPad P53 · Lenovo · Laptop", wrong: "Thinkpad P53" }
  control_question: "If I say the model alone, does it tell me what brand and what kind of thing? If not, it is a fragment."

- id: one-idea-one-value
  taught: 2026-11-12
  rule: >
    Synonyms are forced so one idea never becomes two filters: Portátil, notebook
    and laptop are Laptop; Celular Android absorbs teléfono Android; Drone absorbs
    dron; Tarjeta Gráfica absorbs GPU; Desktop absorbs escritorio. The vocabulary
    forces the value at write time, not at read time — two spellings of one thing
    are two filters nobody can see are the same.
  examples:
    - { right: "Laptop", wrong: "Portátil" }
    - { right: "Tarjeta Gráfica", wrong: "GPU" }
  control_question: "Would this value and an existing one answer the same filter twice?"

- id: sizes-are-attributes-not-terms
  taught: 2026-11-12
  rule: >
    A capacity or a size is not a vocabulary term by itself: 27B says nothing
    about what the session is about, and 192GB belongs to the machine, not to the
    subject. The exception is a capacity that DOES define the object when the
    session is about buying it — "16GB RAM" is valid vocabulary because it names
    what the computer comes with. The test is not the number: it is whether the
    number is the thing being discussed or a property of the thing.
  examples:
    - { right: "16GB RAM", note: "the configuration being compared" }
    - { right: "—", wrong: "27B", note: "a size of a model, not a subject" }
    - { right: "PRO 495 · AMD", wrong: "192GB" }
  control_question: "Is the number the subject, or a property of the subject?"

- id: never-vocabulary
  taught: 2026-11-12
  rule: >
    These are never vocabulary, whatever their frequency: greetings and courtesy
    ("Hola DeepSeek"), dates and timestamps ("14-sep-2026"), numeric ranges from
    compressing a list ("56-110"), scaffolding from the interface ("Skill X",
    "Attached", "OUT-OF-BAND"), and the owner's own identifiers — usernames, phone
    numbers, addresses. They are noise in a list that is meant to be a dictionary.
  examples:
    - { right: "—", wrong: "Hola DeepSeek" }
    - { right: "—", wrong: "14-sep-2026" }
    - { right: "—", wrong: "56-110" }
    - { right: "—", wrong: "Skill CyberPanel" }
  control_question: "Would this word appear in a dictionary of what the user works with?"

- id: events-are-a-category
  taught: 2026-11-12
  rule: >
    An event is a thing in the world with a date and a purpose — a hackathon, a
    fair, a course, a conference. "Nous Hackaton 2026" is not a company and not a
    topic: it is an event, and the catalogue needs that category so a session
    about preparing a submission is not filed as if it were about a brand.
  examples:
    - { category: "Event", term: "Nous Hackaton 2026" }
    - { category: "Event", term: "APEDE 2026" }
  control_question: "Does it happen somewhere on a date, with people attending?"

- id: companies-carry-their-trade
  taught: 2026-11-12
  rule: >
    A company in the private vocabulary says what it does, not just its name.
    "(tu forwarder)" is a Freight Forwarder, and its context is the city it ships
    from — Miami (iq2). A list of companies without their trade is a list of
    words; with their trade it is knowledge the classifier can use.
  examples:
    - { company: "(tu forwarder)", trade: "Freight Forwarder", context: "Miami" }
    - { company: "ORICO", trade: "storage and enclosures", context: "" }
  control_question: "What does this company do, and where does it operate?"

# --------------------------------------------------------------------------- #
# FOUR BLIND SPOTS CLOSED (review 2026-11-13, adapted)
# --------------------------------------------------------------------------- #

- id: acronyms-are-not-subjects
  taught: 2026-11-13
  rule: >
    A generic technical acronym of two or three letters is never the subject on
    its own: UI, API, IP, DB, PR, CLI, DNS, RAM, SSD. Alone it is noise in the
    catalogue; it only becomes a subject when it names its object — "API REST",
    "Dirección IP", "CLI Hermes", "Panel DNS". If it appears alone, it is an
    attribute of the description, not the thing the session is about.
  examples:
    - { right: "Panel DNS", wrong: "DNS" }
    - { right: "API REST", wrong: "API" }
    - { right: "—", wrong: "UI" }
  control_question: "Does the acronym name a thing, or is it the abbreviation of a thing named elsewhere?"

- id: file-names-are-not-subjects
  taught: 2026-11-13
  rule: >
    A file name with a technical extension is an implementation detail, never the
    subject: plugin.js, state.db, docker-compose.yml, config.yaml. The subject is
    the component that contains it — "Desktop Plugin", "State DB", "Compose" — and
    the file name belongs in the description where it can be searched literally.
  examples:
    - { right: "Desktop Plugin", wrong: "plugin.js" }
    - { right: "State DB", wrong: "state.db" }
  control_question: "If I search in six months, would I type the file name or the component?"

- id: compare-keeps-the-closest
  taught: 2026-11-13
  rule: >
    In a session whose intention is Compare with two candidates of the same rank,
    iq0 takes the candidate CLOSEST TO THE USER — the one he already owns or is
    about to use — and the other goes to the description intact. Only when neither
    is his does the first-mentioned take iq0. The pair may be condensed into one
    subject only if it fits in three words ("Mac mini M4 vs P53"); otherwise the
    second name never enters iq0.
    This keeps an older rule that outranks it: the subject is the item he holds,
    not the candidate being evaluated.
  examples:
    - { right: "ThinkPad P53 · Lenovo · Compare", note: "he owns the P53; the M4 is the candidate", wrong: "Mac mini M4 · Apple · Compare" }
    - { right: "Mac mini M4 vs P53", note: "both are candidates, they fit in three words" }
  control_question: "Which of the two is already in his hands? That one is iq0."

- id: open-source-needs-an-ecosystem-not-an-author
  taught: 2026-11-13
  rule: >
    A program in iq0 normally puts its company or author in iq1. For community
    open-source with no commercial parent — curl, ffmpeg, htop, ripgrep, aria2 —
    iq1 carries the ecosystem ("Open Source", "CLI Tool") rather than the name of
    an obscure maintainer, because a personal name nobody recognises is a filter
    that filters nothing. If the project does have a foundation or a company
    (Mozilla, Apache Foundation, Nous Research), that name wins.
  examples:
    - { right: "curl · Open Source", wrong: "curl · Daniel Stenberg" }
    - { right: "Firefox · Mozilla", wrong: "Firefox · Open Source" }
  control_question: "Is there a company or foundation behind it? If there is, use it; if not, the ecosystem."

- id: subject-does-not-repeat-program
  taught: 2026-11-13
  rule: >
    When the subject in iq0 is already the program (e.g. Logseq, DEVONthink, Tinderbox),
    iq1 must NEVER repeat that same name. A duplicate tag in iq1 is "one answer in two
    fields" and dilutes faceted filtering. Leave iq1 empty so that iq2 can carry the
    machine or environment.
  examples:
    - { right: "041 [Logseq] 001 [Mac mini M4] ...", wrong: "041 [Logseq] 001 [Logseq] [Mac mini M4] ..." }
    - { right: "071 [DEVONthink] 001 Evaluar CLI/MCP...", wrong: "071 [DEVONthink] 001 [DEVONthink] Evaluar CLI/MCP..." }
  control_question: "Does iq1 repeat the exact same name already given in iq0?"

- id: no-prepositional-amputation
  taught: 2026-11-13
  rule: >
    A four-word nominal syntagm bound by prepositions or model qualifiers (e.g.
    "Migración Android a iPhone", "Gemini 3.1 Flash Lite") must NEVER be severed
    leaving dangling prepositions ("a iPhone") or isolated model qualifiers ("3.1 Lite")
    tacked onto descriptions. If a subject cannot be reduced to a clean 1-3 word nominal
    head without stranding proper nouns or prepositional complements, leave it intact.
  examples:
    - { right: "091 [Migración Android a iPhone] 001 [Apple]", wrong: "091 [Migración Android] 001 [Apple] ... · a iPhone" }
    - { right: "257 [Gemini 3.1 Flash Lite] 001 [Google]", wrong: "257 [Gemini] 001 [Google] ... · 3.1 Lite · Comparar" }
  control_question: "Does cutting the subject leave a dangling prepositional complement or stranded proper noun?"

- id: repair-mutilated-subject-from-description
  taught: 2026-11-13
  rule: >
    When legacy mechanical cuts (such as 35-character slicing) have severed words
    mid-word ("perdid", "proyect", "plugin Ma"), do not discard or mutilate further.
    Look into the description or first user message for the intact known entity (e.g.
    "Brave", "Make It Smart") and assign that clean entity as the subject, restoring
    the remaining words to the description.
  examples:
    - { right: "947 [Brave] 001 Recuperar ventanas y pestañas perdidas", wrong: "947 [Recuperar ventanas y pestañas perdid] 001 ..." }
    - { right: "927 [Make It Smart] 001 Verificar sesión nueva", wrong: "927 [Verificar sesión nueva del plugin Ma] 001 ..." }
  control_question: "Is a word sliced mid-word in the subject, and does the description contain the intact entity?"

- id: description-never-contains-middle-dot
  taught: 2026-11-13
  rule: >
    The middle dot (" · ") is strictly reserved for separating the canonical trailing
    verb at the end of the title. It must NEVER be used to join phrases or appended
    fragments within the description field. Join clauses inside description with
    commas, semicolons or natural syntax.
  examples:
    - { right: "Costo por token vs DeepSeek V4 Flash Vision · Comparar", wrong: "Costo por token vs DeepSeek V4 Flash Vision · 3.1 Lite · Comparar" }
  control_question: "Does the title contain more than one middle dot (' · ')?"

- id: transfer-tail-to-description-on-virgin-titles
  taught: 2026-11-13
  rule: >
    When deriving a subject from a virgin, uncanonical title (e.g. "Firefox tarda mucho
    en arrancar"), never discard the remaining tail of words. Transfer the tail directly
    into the description so the session context and task purpose are preserved.
  examples:
    - { right: "972 [Firefox] 001 tarda mucho en arrancar", wrong: "972 [Firefox] 001" }
    - { right: "973 [Steren COM-6900] 001 Configurar layout del teclado", wrong: "973 [Steren COM-6900] 001" }
  control_question: "Did extracting the subject leave the session description empty when there was a descriptive predicate in the original title?"
