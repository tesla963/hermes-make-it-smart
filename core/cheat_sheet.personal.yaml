# ============================================================================
# BATERÍA PERSONAL  ·  lo que este usuario sabe de su propio mundo
# ============================================================================
# Este archivo NO se publica. Vive fuera del repositorio y es tuyo.
#
# `cheat_sheet.yaml` es conocimiento objetivo: qué es USPS Ground Advantage, quién
# hace ThinkPad, qué significa un pilar. Ese archivo viaja con el plugin.
#
# Este es lo contrario: prejuicios, experiencias y reglas de casa. «Con este
# courier los paquetes se pierden», «en Amazon uso Prime», «el cliente X solo
# contesta por WhatsApp». Cosas que ningún manual sabe y que hacen que el
# clasificador suene como tú.
#
# Cómo se usa: el clasificador lee las dos. Cuando una regla de aquí choca con
# una de allá, gana la de aquí — tu experiencia manda sobre el manual.
#
# Ejemplos de lo que va aquí (descomenta y edita los tuyos):
# ----------------------------------------------------------------------------
version: 1
owner: jorge

# Preferencias de compra: qué carrier uso en cada tienda y por qué.
preferencias_envio:
  # amazon:
  #   carrier: Prime
  #   nota: "Lo que no es Prime llega en dos semanas; no vale la pena."
  # ebay:
  #   carrier: [USPS Ground Advantage, FedEx Ground]
  #   evitar: [Miami Express]
  #   nota: "Con Miami Express los paquetes se pierden."

# Servicios que uso y su veredicto en una línea.
servicios:
  # "Miami Express":
  #   veredicto: perder
  #   evidencia: "Tres paquetes sin llegar en 2026."

# Vocabulario propio: cómo llamo yo a las cosas, para que el clasificador
# use mi palabra y no la suya.
vocabulario:
  # "el server": "okimatsu.com"
  # "la laptop": "ThinkPad P53"

# Reglas de casa: cosas que quiero que el clasificador respete siempre.
reglas:
  # - "Cuando digo 'envío' en una sesión de eBay, el sujeto es el carrier."
