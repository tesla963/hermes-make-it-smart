# ============================================================================
# THE CHEAT SHEET  ·  what the plugin knows before it asks a model
# ============================================================================
# A "cheat sheet" is the little sheet you copied from in school. This is that, for
# the classifier: the things you have learned about your own world, written
# down so the scripts do not have to guess them again.
#
# Every user keeps their own. Edit it freely — it is data, not code.
#
# How the classifier uses it, in order:
#   1. `marcas`     — a name found in a subject decides iq1 and whether the
#                     brand leaves the subject.
#   2. `productos`  — a known product fixes the subject and the model axis.
#   3. `programas`  — software: its maker, and whether the program name is a
#                     brand of its own (most open source is).
#   4. `companias`  — what a company makes, so a company name never becomes a
#                     subject by accident.
#   5. `servicios`  — anything hired rather than bought: hosting, courier,
#                     subscription. Pillar = Servicios.
#   6. `conceptos`  — recurring subjects that must survive as filters.
#   7. `sin_marca`  — products with no corporate owner: their own name is the
#                     brand. This is the common case in open source.
# ============================================================================

version: 1
updated: 2026-11-09
owner: the owner

# ---------------------------------------------------------------------------
# MARCAS — name found in a subject -> iq1
#   strip: true  = the brand leaves the subject ("Dell Inspiron" -> "Inspiron")
#   strip: false = the brand is part of the product name ("ThinkPad P53")
# ---------------------------------------------------------------------------
marcas:
  lenovo:
    iq1: Lenovo
    strip: false
    lineas: [ThinkPad, ThinkCentre, Legion, IdeaPad]
    nota: "ThinkPad es la LÍNEA, no la marca. El sujeto conserva 'ThinkPad P53'."
  dell:
    iq1: Dell
    strip: true
    lineas: [Inspiron, Latitude, Precision, XPS, OptiPlex]
  apple:
    iq1: Apple
    strip: false
    lineas: [Mac mini, Mac Studio, MacBook, iPhone, iPad, Apple Watch]
    nota: "El nombre del equipo se queda en el sujeto: 'Mac mini M4'."
  amd:
    iq1: AMD
    strip: false
    productos: [Gorgon Halo, Strix Halo, Ryzen AI Max, Ryzen, Threadripper]
    nota: "NO abreviar estos nombres: 'Gorgon' a secas no significa nada."
  nvidia:
    iq1: NVIDIA
    strip: false
    productos: [RTX 5090, RTX 4090, Quadro, A5000, A3000, Spark]
  primatelabs:
    iq1: Primate Labs
    sitio: https://www.geekbench.com/
    productos: [Geekbench]
    nota: Geekbench es el producto; la compania es Primate Labs (Toronto).
  gardengnome:
    iq1: Garden Gnome
    sitio: https://ggnome.com/
    productos: [Pano2VR, Object2VR]
    nota: Pano2VR es de Garden Gnome GmbH (Viena).
  rtools:
    iq1: R-Tools
    sitio: https://www.r-studio.com/
    productos: [R-Studio]
    nota: R-Studio es de R-Tools Technology, Inc.
  nous:
    iq1: Nous Research
    sitio: https://nousresearch.com/
    productos: [Hermes Agent, Hermes Desktop, Hermes Terminal, Ornith]
    nota: >
      Hermes y Ornith son de Nous Research. Pero "Hermes Agent" NUNCA es iq1
      cuando el sujeto es otra cosa: el asistente es el AUTOR de la sesion.
      Solo va como marca cuando el sujeto ES un producto de Nous.
  samsung:
    iq1: Samsung
    sitio: https://www.samsung.com/
    productos: [Galaxy A55, Galaxy S, A55]
  iterm2:
    iq1: ""
    nota: >
      iTerm2 es software libre de George Nachman, sin compania detras. La
      regla del dueno: cuando el software libre no tiene empresa, el nombre ES
      la marca y no se repite en iq1. Se deja vacio.
  goveelife:
    iq1: GoveeLife
    sitio: https://www.govee.com/
    productos: [Hygrometer, Thermometer, H5151, H5101]
    nota: >
      La marca es "GoveeLife", la linea domestica de Govee. Sus sensores llevan
      un gateway propio y se instalan por la app Govee Home.
  rayneo:
    iq1: RayNeo
    sitio: https://www.rayneo.com/
    productos: [Air 2, Air 4 Pro, GT Max, X2]
    nota: >
      La marca se escribe "RayNeo", en una sola palabra y con la N mayuscula.
      No es "Ray Neo" ni "RayNEO". Son gafas AR: se conectan por USB-C con
      DP Alt Mode, asi que funcionan con cualquier salida de video compatible,
      incluido el DJI RC 2.
  dji:
    iq1: DJI
    strip: false
    productos: [Air 2S, Air 2, Avata 360, Osmo Pocket, Mini, Mavic, RC 2]
  insta360:
    iq1: Insta360
    strip: false
    productos: [X4, GO Ultra, Luna Ultra, Sphere]
  orico:
    iq1: ORICO
    strip: false
    productos: [Case USB, DD28C3C, 8628SUS3]
  google:
    iq1: Google
    sitio: https://www.google.com/
    strip: true
    productos: [Chrome, Chromium, Gemini, Gemini Desktop, Gemini Flash Lite,
                Gemini Pro, Workspace, Drive, Pixel]
  anthropic:
    iq1: Anthropic
    strip: true
    productos: [Claude, Claude Code, Haiku, Sonnet, Opus]
  openai:
    iq1: OpenAI
    strip: true
    productos: [ChatGPT, GPT, o1, o3]
  moonshot:
    iq1: Moonshot
    strip: true
    productos: [Kimi, K2, K3]
  alibaba:
    iq1: Alibaba
    strip: true
    productos: [Qwen, Qwen3]
  xai:
    iq1: xAI
    strip: true
    productos: [Grok]
  deepseek:
    iq1: DeepSeek
    strip: true
    sitio: https://www.deepseek.com/
    productos: [V4, V4 Flash, V4.1 Flash, V4 Pro, R1]
  microsoft:
    iq1: Microsoft
    strip: true
    productos: [Windows, Office, Copilot, OneDrive, Teams]
  steren:
    iq1: Steren
    strip: true
    productos: [Teclado, COM-6900]

# ---------------------------------------------------------------------------
# PROGRAMAS — software whose own name is the brand.
# This is the open-source rule: no company to point at, so the program names
# itself. If `marca` is set, that wins.
# ---------------------------------------------------------------------------
programas:
  pinokio:
    marca: Pinokio
    maker: cocktailpeanut
    licencia: MIT
    nota: "Lanzador local de apps de IA. Sin empresa detrás: el nombre ES la marca."
  ornith:
    marca: Ornith
    maker: Ornith
    nota: "Modelos abiertos servidos por Nous Portal."
  logseq:
    marca: Logseq
  obsidian:
    marca: Obsidian
  devonthink:
    marca: DEVONthink
    maker: Devon Technologies
    alias: [Devon Think, "DEVONthink 3", DEVONagent]
    # The company is not in the programme's name: it is on the download page.
    sitio: https://www.devontechnologies.com/
    nota: >
      "DEVONthink" es el programa; "Devon Technologies" es la compañía. El
      sitio oficial es la prueba, no el nombre del producto.
  tinderbox:
    marca: Tinderbox
    maker: Eastgate
  cyberpanel:
    marca: CyberPanel
    maker: CyberPersons
  rustdesk:
    marca: RustDesk
  brave:
    marca: Brave
    maker: Brave Software
  hermes:
    marca: Hermes Agent
    nota: "Hermes Agent · Hermes Desktop · Hermes Terminal · Hermes Telegram. Nunca 'Hermes' a secas."
  ollama:
    marca: Ollama
  llamacpp:
    marca: llama.cpp
  comfyui:
    marca: ComfyUI
  handbrake:
    marca: HandBrake
  resolve:
    marca: DaVinci Resolve
    maker: Blackmagic Design
  skillspector:
    marca: Nvidia
    programa: SkillSpector
    nota: "Programa de Nvidia: el fabricante va en Iq1 y el nombre del programa en la descripción."
  voicebox:
    marca: VoiceBox

# ---------------------------------------------------------------------------
# PRODUCTOS — things bought, with brand and model separated.
# Iq1 = marca · Iq2 = modelo · Pilar = Productos
# ---------------------------------------------------------------------------
productos:
  teclado:
    forma: "sujeto = el objeto genérico, Iq1 = marca, Iq2 = modelo"
    ejemplos:
      - { sujeto: Teclado, iq1: Steren, iq2: COM-6900 }
  laptop:
    ejemplos:
      - { sujeto: Precision 7760, iq1: Dell }
      - { sujeto: ThinkPad P53, iq1: Lenovo }
      - { sujeto: ThinkPad E580, iq1: Lenovo }
  dron:
    ejemplos:
      - { sujeto: Air 2S, iq1: DJI, iq2: Ebay }
      - { sujeto: Avata 360, iq1: DJI }
  case_usb:
    ejemplos:
      - { sujeto: Case USB, iq1: ORICO }
  disco:
    nota: "El disco es el objeto; la capacidad va en la descripción salvo que sea el tema."
    ejemplos:
      - { sujeto: Hard Drive, iq1: Marca Desconocida, verbo: Falta de Espacio }
  memoria:
    nota: "Aquí la spec SÍ es el sujeto, porque la sesión trata de ella."
    ejemplos:
      - { sujeto: "16 GB Ram", iq6: Mac mini M4 }
  tarjeta_grafica:
    ejemplos:
      - { sujeto: RTX 5090, iq1: NVIDIA }
      - { sujeto: Quadro T1000, iq1: NVIDIA }

# ---------------------------------------------------------------------------
# COMPAÑIAS — never a subject by accident.
# ---------------------------------------------------------------------------
companias:
  nous: { nombre: Nous Research, hace: [Hermes Agent, Ornith] }
  cyberpersons: { nombre: CyberPersons, hace: [CyberPanel] }
  blackmagic: { nombre: Blackmagic Design, hace: [DaVinci Resolve] }
  eastgate: { nombre: Eastgate, hace: [Tinderbox] }
  mi_forwarder: { nombre: "(tu forwarder)", hace: [courier, casillero] }

# ---------------------------------------------------------------------------
# SERVICIOS — hired, not bought. Pilar = Servicios.
# ---------------------------------------------------------------------------
servicios:
  hosting: { ejemplos: [CyberPersons, VPS, dominio, correo] }
  courier: { ejemplos: ["(tu forwarder)", casillero, freight forwarder] }
  suscripcion: { ejemplos: [Google AI Pro, iCloud, Backblaze] }

# ---------------------------------------------------------------------------
# CONCEPTOS — recurring subjects that are also filters.
# A concept is a permanent noun, not a description.
# ---------------------------------------------------------------------------
conceptos:
  hack_history:
    nombre: Hack History
    que_es: >
      Archivo de amenazas, incidentes y exposición del agente: qué ataques se
      han documentado, qué vectores se han visto, qué se aprendió. Más propio
      del mundo OpenClaude, que tiene más historia en ese terreno.
    iq2: Data Security
    ejemplos: [872]
  ventana_permisos:
    nombre: Ventana Permisos
    que_es: "El diálogo de permisos del sistema. Tema recurrente a lo largo de meses."
    iq1: Hermes Agent
    iq2: Data Security
    ejemplos: [10, 13, 90, 533, 720, 821, 877]
  protocolo:
    nombre: Protocolo
    que_es: "El gateway roto: se nombra el punto de falla, no el componente."
    iq2: Troubleshooting
    ejemplos: [20, 81]
  flight_paths:
    nombre: Flight Paths
    que_es: >
      Trayectorias de vuelo programables que el dron ejecuta solo: waypoints con
      coordenadas, altura, velocidad, orientación de cámara y acciones.
      DJI las llama Waypoints y las habilitó en el Avata 360; Antigravity A1 las
      llama Flight Paths. En este catálogo el sujeto es siempre "Flight Path",
      en singular — "Flight Paths", "Waypoints", "paths programables" y "rutas"
      son la misma cosa y no dividen el filtro.
    iq1: [DJI, Antigravity A1]
    iq2: [Multimedia, Automation]
    ejemplos: [157, 430, 585, 730, 773, 844]
    sinonimos: [waypoints, path programable, flight paths, rutas de vuelo]
    no_confundir: >
      "Avata 360" es el DRON y es otro sujeto. Una sesión sobre el dron —sus
      especificaciones, su registro, sus goggles— lleva sujeto "Avata 360";
      una sesión sobre trayectorias programables lleva sujeto "Flight Path".
      Ejemplos: 654 y 802 son Avata 360; 157, 430, 585, 730, 844 son Flight Path.
  descuentos_jubilados:
    nombre: Descuentos a Jubilados
    que_es: >
      Beneficio comercial y legal que rebaja el precio a personas jubiladas.
      La preposición "a" forma parte del nombre del concepto: no es una oración
      y no viola la regla de sujeto puntual.
    iq1: Hermes Agent
    ejemplos: [267]
  harness_agent:
    nombre: Harness Agent
    que_es: >
      El andamiaje que ejecuta al agente: el bucle, las herramientas, los
      permisos, el runtime. Cuando se comparan lenguajes o plataformas por su
      capacidad de correr agentes (Python frente a OpenClaw), el sujeto es
      "Harness Agent" — no "Motor", no "Lenguaje".
    iq1: Hermes Agent
    iq2: Programming
    ejemplos: [14]
  spotlight:
    nombre: Spotlight
    que_es: "El indexador de macOS. La acción de indexar va al verbo, no al sujeto."
    iq1: Tahoe
    ejemplos: [19819]

# ---------------------------------------------------------------------------
# SIN MARCA — no corporate owner: the product's own name is the brand.
# This is the default for software.
# ---------------------------------------------------------------------------
logistica:
  # Carriers y sus productos. La marca va al iq1; el producto es el sujeto.
  usps:
    iq1: USPS
    pais: Estados Unidos
    productos:
      "Ground Advantage":
        es: >
          Servicio terrestre de USPS, 2–5 días dentro de EE. UU., con tracking
          incluido y sin recargo por combustible. Es la opción para paquetes
          ligeros (menos de 1 lb) y para direcciones que los carriers privados
          no alcanzan.
        sujeto: Ground Advantage
      "Priority Mail":
        es: 1–3 días, tracking incluido, sin garantía de fecha.
        sujeto: Priority Mail
      "Priority Mail Express":
        es: 1–2 días con garantía de entrega o reembolso.
        sujeto: Priority Mail Express
    nota: >
      "USPS Ground Advantage" se parte: iq1 = USPS, sujeto = "Ground Advantage".
      La marca nunca se queda dentro del sujeto cuando el producto tiene nombre.
  fedex:
    iq1: FedEx
    pais: Estados Unidos
    productos:
      "Ground":
        es: Servicio terrestre doméstico, 1–5 días según distancia.
        sujeto: FedEx Ground
      "Ground Delivery":
        es: La misma red terrestre para entregas residenciales.
        sujeto: Ground Delivery
      "Home Delivery":
        es: Entrega residencial dentro de la red Ground.
        sujeto: Home Delivery
  ups:
    iq1: UPS
    pais: Estados Unidos
    productos:
      "Ground":
        es: Red terrestre doméstica, 1–5 días. El estándar de confiabilidad.
        sujeto: UPS Ground
  dhl:
    iq1: DHL
    pais: Internacional
    productos:
      "Express":
        es: Courier internacional puerta a puerta con aduana incluida.
        sujeto: DHL Express
  confiabilidad:
    # Dato objetivo, medido sobre Q4 2025. El algoritmo no lo usa para decidir,
    # pero la descripción de una sesión de compras puede apoyarse en él.
    puntualidad_q4_2025: { UPS: 97.6, FedEx: 96.1, USPS: 94.2 }
    nota: >
      UPS lidera en terrestre doméstico; USPS gana en paquetería menor de 1 lb
      y en direcciones rurales o apartados postales.

sin_marca:
  regla: >
    Si un producto o programa no tiene empresa detrás, su propio nombre es la
    marca y va en Iq1. Nunca se deja vacío y nunca cae a "Hermes Agent".
  ejemplos: [Pinokio, Ornith, Logseq, Obsidian, HandBrake, ComfyUI, RustDesk]
  error_comun: >
    Asignar "Hermes Agent" porque no se reconoce la marca. Eso convierte el
    filtro más usado en un cajón de sastre.
